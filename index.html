<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Modern Typing Test</title>
	<link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
	<script src="https://unpkg.com/alpinejs" defer></script>
</head>

<body class="bg-gray-900 text-gray-100 w-screen h-screen m-0 p-4 flex flex-col items-center justify-center overflow-hidden">
	<!-- Full Device Sizing Container -->
	<div x-data="data()" class="w-full h-full max-w-7xl max-h-[95vh] bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-2xl border border-gray-700 flex flex-col justify-between">
		
		<!-- Header -->
		<header class="flex justify-between items-center pb-4 border-b border-gray-700">
			<h1 class="text-2xl font-bold tracking-wide text-blue-400">⚡ Typing Speed Test</h1>
			<button @click="startTest()" 
					class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-6 rounded-xl transition duration-200 shadow-lg cursor-pointer">
				<span x-text="testStarted ? 'Restart Test' : 'Start Test'"></span>
			</button>
		</header>

		<!-- Main Content Grid: Expands to fill available vertical space -->
		<div class="grid grid-cols-1 lg:grid-cols-4 gap-6 my-auto flex-grow py-6 items-stretch">
			
			<!-- Left Side: Test Area (Takes up 3 columns on large screens) -->
			<div class="lg:col-span-3 flex flex-col h-full space-y-4">
				<!-- Target Text Box -->
				<div x-show="question != ''" 
					 class="bg-gray-900 p-6 rounded-xl text-gray-300 leading-relaxed text-lg tracking-wide border border-gray-700 select-none flex-grow overflow-y-auto max-h-[35vh]" 
					 x-text="question">
				</div>
				
				<div x-show="question == ''" class="bg-gray-900 p-6 rounded-xl text-gray-500 text-center text-lg italic border border-gray-700 flex-grow flex items-center justify-center max-h-[35vh]">
					Click "Start Test" to begin typing...
				</div>

				<!-- Solution Input Area -->
				<div class="flex-grow">
					<textarea x-model="solution" 
							  id="solution_textarea" 
							  class="w-full h-40 lg:h-full bg-gray-900 text-gray-100 p-5 rounded-xl border border-gray-700 focus:border-blue-500 focus:outline-none resize-none text-lg leading-relaxed shadow-inner" 
							  placeholder="Start typing the text above here..." 
							  readonly 
							  @input="checkFinished()"></textarea>
				</div>
			</div>

			<!-- Right Side: Statistics Result Dashboard (Takes up 1 column) -->
			<div class="bg-gray-900 p-6 rounded-xl border border-gray-700 flex flex-col justify-around text-center h-full">
				<h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-800 pb-2">Live Metrics</h2>
				
				<div>
					<div class="text-xs text-gray-400 uppercase tracking-wider">Time Elapsed</div>
					<div class="text-3xl sm:text-4xl font-bold text-blue-400 mt-1"><span x-text="time"></span>s</div>
				</div>

				<div>
					<div class="text-xs text-gray-400 uppercase tracking-wider">Words Typed</div>
					<div class="text-3xl sm:text-4xl font-bold text-green-400 mt-1" x-text="words"></div>
				</div>

				<div>
					<div class="text-xs text-gray-400 uppercase tracking-wider">Words Per Min (WPM)</div>
					<div class="text-3xl sm:text-4xl font-bold text-yellow-400 mt-1" x-text="wpm"></div>
				</div>

				<div>
					<div class="text-xs text-gray-400 uppercase tracking-wider">Chars Per Min (CPM)</div>
					<div class="text-3xl sm:text-4xl font-bold text-purple-400 mt-1" x-text="cpm"></div>
				</div>
			</div>

		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
